# Builds and pushes the multi-arch image to Docker Hub.
#
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  - the Docker Hub account
#   DOCKERHUB_TOKEN     - an access token from Docker Hub > Account Settings >
#                         Personal access tokens (not the password)
name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hexward/rulehawk:${{ steps.v.outputs.version }}
            hexward/rulehawk:latest
