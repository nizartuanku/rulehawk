# Builds and pushes the multi-arch image to Docker Hub.
#
# Needs two repository secrets — Settings > Secrets and variables > Actions:
#   DOCKERHUB_USERNAME  the Docker Hub account
#   DOCKERHUB_TOKEN     an access token from Docker Hub > Account Settings >
#                       Personal access tokens (not the password)
#
# Without them the job says so and ends green rather than failing: a release
# should not look broken because an optional publishing step is not set up.
name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Are the Docker Hub credentials configured?
        id: cfg
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Docker image not published"
              echo
              echo "\`DOCKERHUB_USERNAME\` and \`DOCKERHUB_TOKEN\` are not set, so"
              echo "this step was skipped. The release binaries are unaffected."
              echo
              echo "Add both under Settings > Secrets and variables > Actions,"
              echo "then re-run this workflow to publish the image."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.cfg.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.cfg.outputs.ready == 'true'
      - uses: docker/login-action@v3
        if: steps.cfg.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Version
        id: v
        if: steps.cfg.outputs.ready == 'true'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.cfg.outputs.ready == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hexward/rulehawk:${{ steps.v.outputs.version }}
            hexward/rulehawk:latest
