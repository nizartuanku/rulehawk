# Builds the release binaries and publishes the GitHub release.
#
# Trigger:  git tag v0.1.1 && git push origin v0.1.1
#
# CGO is mandatory (the SQLite driver needs it), so every target is built on a
# runner of its own platform rather than cross-compiled — except linux/arm64,
# which uses the aarch64 cross toolchain. The Linux binaries are linked static
# with the pure-Go resolver, so one file runs on any distribution.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: linux-arm64
            runs-on: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: darwin-arm64
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
          - target: darwin-amd64
            runs-on: macos-15-intel
            goos: darwin
            goarch: amd64
          - target: windows-amd64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross toolchain
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          MATRIX_CC: ${{ matrix.cc }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$MATRIX_CC" ]; then export CC="$MATRIX_CC"; fi
          mkdir -p dist/pkg

          if [ "$GOOS" = linux ]; then
            tags='netgo osusergo sqlite_omit_load_extension'
            ldflags='-s -w -linkmode external -extldflags "-static"'
          else
            tags='sqlite_omit_load_extension'
            ldflags='-s -w'
          fi

          out=dist/pkg/rulehawk
          if [ "$GOOS" = windows ]; then out=dist/pkg/rulehawk.exe; fi
          go build -trimpath -tags "$tags" -ldflags "$ldflags" -o "$out" ./cmd/rulehawk

          cp LICENSE.txt README.md dist/pkg/
          if [ "$GOOS" != windows ]; then
            tar -C dist/pkg -czf "dist/rulehawk-free-${version}-${TARGET}.tar.gz" .
          fi
          ls -la dist

      # Compress-Archive ships with PowerShell on every Windows runner; 7-Zip's
      # presence and PATH are an image detail we would rather not depend on.
      - name: Package (windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/rulehawk-free-$version-${{ matrix.target }}.zip"
          Get-ChildItem dist

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/pkg/rulehawk -db /tmp/smoke.db -listen 127.0.0.1:8426 >/tmp/smoke.log 2>&1 &
          sleep 3
          curl -sf http://127.0.0.1:8426/api/license | grep -q '"tier":"free"'
          echo "dashboard answered"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          {
            echo "Verify a download:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "Docker: \`docker pull hexward/rulehawk:${version}\`"
          } > ../notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "RuleHawk $version" \
            --notes-file notes.md
